name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Don't cancel in-progress builds of the default branch — every merge to main
  # should produce a completed build.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Fail the build if the committed gradle-wrapper.jar doesn't match a
          # known-good Gradle release checksum (supply-chain guard).
          validate-wrappers: true

      - name: Build
        run: ./gradlew build --stacktrace
