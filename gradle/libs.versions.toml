# Shared version catalog — the single source of truth for komust's build.
#
# Kotlin is load-bearing and EXACT-pinned: the K2 compiler-plugin API
# (`@ExperimentalCompilerApi`, `@UnsafeDuringIrConstructionAPI` and the IR
# construction surface behind them) is officially unstable and changes shape
# every Kotlin release. Every touch of that surface is funnelled through the
# compat-shim seam in `komust-compiler-plugin` (io.komust.compiler.ir.KotlinIrCompat),
# so a Kotlin bump is a deliberate, tested change confined to one file.
# See docs/adr/0005-gradle-plugin-architecture.md.
[versions]
kotlin = "2.2.0"
# JUnit Platform: the engine drives tests through the Platform Launcher API
# directly (ADR-0005 §4), so the Platform version is pinned, not just Jupiter.
# The JUnit BOM aligns Jupiter + Platform to one release train.
junit = "6.1.3"
# JaCoCo instruments the coverage pass (ADR-0004). >= 0.8.15 is the floor:
# older releases mis-handle Kotlin inline-function line tables.
jacoco = "0.8.15"
kotlinxSerialization = "1.9.0"
# kotlin-compile-testing (Zac Sweers' K2-tracking fork). Drives an in-process K2
# compile of fixture sources in `komust-compiler-plugin`'s tests, against the
# exact pinned Kotlin above (it resolves the compiler off the test classpath).
kctfork = "0.8.0"

[libraries]
# Provided by the Kotlin compiler at plugin-load time; never shipped.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-gradle-plugin-api = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin-api", version.ref = "kotlin" }
# The kotlinx.serialization Kotlin compiler plugin, applied by modules that
# (de)serialise JSON (komust-scope's scope.json; later komust-engine's output).
# Pulled onto the buildSrc classpath so a module applies `kotlin("plugin.serialization")`
# without re-declaring a version.
kotlin-serialization-plugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

kctfork-core = { module = "dev.zacsweers.kctfork:core", version.ref = "kctfork" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
